# dsh-subagent-preset-in-process bundle patch.
#
# A bundle patch targets rows by id. New rows (the provider + the delegation
# tool) are introduced with one `- insert:` block. The `agent-presets` roster
# is NOT restated here: the base bundle already mounts it (default `standard`,
# `includeUserRoot: true`), so the pinned `subagent-slim` preset is discovered
# from the harness-home user root `$DSH_HOME/.agent-presets` — no need to
# override the shipped roots and clobber `standard`/`minimal`/`code`/`cordis`.

- insert:
    # ── the preset-pinning backend (host plane) ────────────────────────────
    # Registered once, process-global, like the shipped spawn/fork backends.
    # `providerName` is what `tool-subagent` selects below; `presetId` is the
    # preset every (non-crew) child is composed under; `provider`/`model` are
    # the base route — Settings → Plugins overrides them live and every child
    # follows the resolved values. `crews` declares role-bound continuable
    # workers: each role has its own preset, optional model route, an optional
    # `toolFilter`, and a `roleTask` delivered on every turn.
    - id: subagent-preset-in-process
      name: 'dsh-subagent-preset-in-process'
      config:
        providerName: preset
        presetId: subagent-slim
        # Base route only — Settings → Plugins overrides it live, and EVERY
        # child (one-shot, continuable, crew) follows the resolved settings.
        provider: merge
        model: deepseek/deepseek-v4-flash-0731
        # The filter every pinned child gets, applied by the PLUGIN after the
        # child is re-linked onto its preset — so it is validated against the
        # composition the child ENDS UP on. A filter on the delegating tool row
        # below would instead be validated by the harness at creation, against
        # the parent's composition, where a plane-specific name fails the spawn
        # with "tools.restrict() names unknown global tool".
        toolFilter:
          allow: [bash, read, write, edit, glob, grep, find_symbol, read_image, crew_wait, todo_write]
        crews:
          # Routed crew (model chooses next role; add mode: pipeline for deterministic chain).
          # `toolFilter.allow` pins each role to the slim preset's tool set — REQUIRED on
          # host-plane deployments (CLI/headless): there the preset join is additive, so
          # without a filter every role silently sees the parent's full global tool set.
          # On the web plane the same names are no-ops (the preset owns those tools).
          #
          # EVERY list below names `find_symbol`, and so must any list added here.
          # A filter is a GLOBAL-tool mask: an omitted name is removed from the
          # child's view even though the pinned preset registers it and its
          # order-115 section tells the child to use it. Omitting it on
          # 2026-09-14 produced the "registered but never delivered" report —
          # the row applied, `register()` returned, the tool stayed invisible —
          # while every allow-list OUTSIDE this file already named it, which is
          # why this layer went unexamined for so long. Inspect the composed
          # filter with scripts/render-composition.mjs, no boot required.
          engineering:
            mode: routed
            orchestratorRole: orchestrator
            roles:
              - name: planner
                presetId: subagent-slim
                toolFilter: { allow: [bash, read, write, edit, glob, grep, find_symbol, read_image, crew_handoff, crew_status, crew_task_update, crew_wait, get_goal, todo_write] }
                roleTask: Break the goal into ordered tasks and hand them to the orchestrator.
              - name: orchestrator
                presetId: subagent-slim
                toolFilter: { allow: [bash, read, write, edit, glob, grep, find_symbol, read_image, crew_handoff, crew_status, crew_task_update, crew_wait, get_goal, todo_write] }
                roleTask: Route each task to the right role and track completion.
              - name: builder
                presetId: subagent-slim
                toolFilter: { allow: [bash, read, write, edit, glob, grep, find_symbol, read_image, crew_status, crew_handoff, crew_wait, todo_write] }
                roleTask: Implement the assigned task and report the result.
              - name: verifier
                presetId: subagent-slim
                toolFilter: { allow: [bash, read, write, edit, glob, grep, find_symbol, read_image, crew_status, crew_verify, crew_handoff, crew_wait, todo_write] }
                roleTask: Verify the builder's result against the task and report.
                # Per-role route override (request > settings > parent). Omit it
                # and this role follows Settings → Plugins like every other
                # child; set it and only the named fields are pinned:
                # agentOptions: { model: deepseek/deepseek-v4-flash-0731, maxTokens: 32000 }
          # Pipeline crew (deterministic order + verify-gate + structured tasks)
          engineering-pipeline:
            mode: pipeline
            roles:
              - name: planner
                presetId: subagent-slim
                toolFilter: { allow: [bash, read, write, edit, glob, grep, find_symbol, read_image, crew_handoff, crew_status, crew_task_update, crew_wait, todo_write] }
                roleTask: Break the goal into tasks; hand T1 to builder.
                tasks: [{ id: T1, title: Implement the requested change, acceptanceCriteria: Change implemented and reported, status: pending }]
              - name: builder
                presetId: subagent-slim
                toolFilter: { allow: [bash, read, write, edit, glob, grep, find_symbol, read_image, crew_status, crew_handoff, crew_wait, todo_write] }
                roleTask: Implement the task (evidence = what you changed); hand to verifier.
              - name: verifier
                presetId: subagent-slim
                toolFilter: { allow: [bash, read, write, edit, glob, grep, find_symbol, read_image, crew_status, crew_verify, crew_handoff, crew_wait, todo_write] }
                roleTask: Verify T1 against acceptanceCriteria; call crew_verify with pass/fail.
            pipeline: { order: [planner, builder, verifier], verifyGate: { enabled: true, verifierRole: verifier, maxRetries: 3 } }
          # A second pipeline crew can be declared the same way; switching
          # engineering.mode to pipeline makes that crew deterministic too.

    # ── the model-facing delegation tool ───────────────────────────────────
    # NO LONGER MOUNTED AS A tool-subagent ROW.
    #
    # The plugin registers `subagent_preset` itself, so the PRESET is a CALL
    # ARGUMENT instead of a deployment setting. A `tool-subagent` row cannot
    # express that: its schema exposes only description/prompt/run_in_background
    # (plus the optional model-selection triple) and `SubagentStartRequest`
    # carries no `presetId` on an unpatched harness, so a row can only ever pin
    # the one preset its `provider` instance was registered with. Mounting both
    # would also register the same tool name twice. The plugin instead registers
    # one provider INSTANCE per configured preset and dispatches on the `preset`
    # argument — see `presets:` above and src/preset-tool.ts.
    #
    # Keep every `toolFilter.allow` list in this file in step with the crew
    # lists: a tool name missing from a filter is silently invisible to the
    # child, which is the failure this file already paid for.
    #
    # - id: tool-subagent-preset
    #   name: '@deepseek-ai/dsh-tool-subagent'
    #   config:
    #     provider: preset
    #     toolName: subagent_preset
    #     backgroundMode: continuable
